name: S3 Debug

on: workflow_dispatch

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Load Vultr key
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          VULTR_API_KEY: "op://agent-rig/vultr_api/credential"

      - name: List clusters and tiers
        run: |
          echo "=== VULTR OBJECT STORAGE CLUSTERS ==="
          CLUSTERS=$(curl -s -H "Authorization: Bearer $VULTR_API_KEY" \
            "https://api.vultr.com/v2/object-storage/clusters")
          echo "$CLUSTERS" | jq -r '.clusters[] | "\(.id) \(.region) \(.hostname) \(.tier)"'

          echo ""
          echo "=== TIERS PER CLUSTER ==="
          for CID in $(echo "$CLUSTERS" | jq -r '.clusters[].id'); do
            HOST=$(echo "$CLUSTERS" | jq -r --arg cid "$CID" '.clusters[] | select(.id==($cid|tonumber)) | .hostname')
            echo "--- Cluster $CID ($HOST) ---"
            curl -s -H "Authorization: Bearer $VULTR_API_KEY" \
              "https://api.vultr.com/v2/object-storage/clusters/$CID/tiers" | \
              jq -r '.tiers[]? | "  ID: \(.id) Name: \(.name) SalesName: \(.sales_name) Price: \(.price)"'
          done
