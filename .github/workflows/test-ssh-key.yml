name: Test SSH Key

on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Load via "private key" (with space)
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          KEY_WITH_SPACE: "op://agent-rig/ssh_key/private key"

      - name: Load via "private" (without space)
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          KEY_WITHOUT_SPACE: "op://agent-rig/ssh_key/private"

      - name: Compare both
        run: |
          echo "=== KEY_WITH_SPACE ==="
          echo "$KEY_WITH_SPACE" | wc -l
          echo "$KEY_WITH_SPACE" | head -3
          echo "=== KEY_WITHOUT_SPACE ==="
          echo "$KEY_WITHOUT_SPACE" | wc -l || echo "(not set)"
          echo "$KEY_WITHOUT_SPACE" | head -3 || echo "(not set)"
          echo "=== ssh-keygen test ==="
          echo "$KEY_WITH_SPACE" > /tmp/key_test
          ssh-keygen -l -f /tmp/key_test 2>&1 || true
