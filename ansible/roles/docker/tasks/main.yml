---
# Docker install — non-blocking. If it fails, VM still works, just without Docker.
- name: Remove stale Docker repos and keys
  shell: |
    rm -f /etc/apt/sources.list.d/docker.list 2>/dev/null || true
    apt-key del 7EA0A9C3F273FCD8 2>/dev/null || true
  changed_when: false
  failed_when: false

- name: Install Docker from Ubuntu repos
  apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: yes
    cache_valid_time: 0
  failed_when: false

- name: Add dev user to docker group
  user:
    name: "{{ dev_user }}"
    groups: docker
    append: yes
  failed_when: false

- name: Enable and start Docker
  systemd:
    name: docker
    enabled: yes
    state: started
  failed_when: false
