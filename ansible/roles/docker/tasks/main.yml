---
- name: Remove stale Docker apt repo (leftover from earlier runs)
  file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  ignore_errors: true

- name: Update apt cache fresh
  apt:
    update_cache: yes
    cache_valid_time: 0
  ignore_errors: true

- name: Install Docker from Ubuntu repos
  apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
  ignore_errors: true

- name: Add dev user to docker group
  user:
    name: "{{ dev_user }}"
    groups: docker
    append: yes

- name: Enable and start Docker
  systemd:
    name: docker
    enabled: yes
    state: started
  ignore_errors: true
