---
- name: Remove any stale Docker apt repo (avoids GPG conflicts)
  file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

# Use Ubuntu's native docker.io package — simpler, no GPG issues
- name: Install Docker from Ubuntu repos
  apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: yes

- name: Add dev user to docker group
  user:
    name: "{{ dev_user }}"
    groups: docker
    append: yes

- name: Enable and start Docker
  systemd:
    name: docker
    enabled: yes
    state: started
