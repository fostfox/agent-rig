---
# Docker install — non-blocking. Falls back gracefully if apt repo is broken.
- name: Remove stale Docker apt sources
  shell: rm -f /etc/apt/sources.list.d/docker.list /etc/apt/trusted.gpg.d/docker* 2>/dev/null; apt-get clean 2>/dev/null; true
  changed_when: false

- name: Install Docker via apt
  shell: |
    apt-get update -qq 2>/dev/null || true
    apt-get install -y -qq docker.io docker-compose-v2 2>/dev/null || true
  changed_when: false
  failed_when: false

- name: Add dev user to docker group
  user:
    name: "{{ dev_user }}"
    groups: docker
    append: yes

- name: Enable and start Docker
  systemd:
    name: docker
    enabled: yes
    state: started
  failed_when: false
