---
- name: Install Hermes CLI
  shell: |
    curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
  args:
    creates: /home/{{ dev_user }}/.hermes/bin/hermes
  register: hermes_install

- name: Fix Hermes ownership
  file:
    path: "/root/.hermes"
    state: directory
    recurse: yes
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
  when: hermes_install.changed

- name: Move Hermes to dev user
  shell: |
    if [ -d /root/.hermes ] && [ ! -d /home/{{ dev_user }}/.hermes ]; then
      mv /root/.hermes /home/{{ dev_user }}/.hermes
      chown -R {{ dev_user }}:{{ dev_user }} /home/{{ dev_user }}/.hermes
    fi
  when: hermes_install.changed

# ── Clone public repo ──
- name: Check if public repo exists
  shell: |
    cd /home/{{ dev_user }}/dev/agent-rig && git remote get-url origin 2>/dev/null || echo ""
  register: pub_repo_url
  changed_when: false
  ignore_errors: true

- name: Clone agent-rig (public)
  git:
    repo: https://github.com/fostfox/agent-rig.git
    dest: "/home/{{ dev_user }}/dev/agent-rig"
    version: main
    accept_hostkey: yes
  become_user: "{{ dev_user }}"
  when: pub_repo_url.stdout == ""

# ── Clone private repo via GitHub App token ──
- name: Check if private repo exists
  shell: |
    cd /home/{{ dev_user }}/dev/agent-rig-data && git remote get-url origin 2>/dev/null || echo ""
  register: priv_repo_url
  changed_when: false
  ignore_errors: true

- name: Clone agent-rig-data (private) via GitHub App
  shell: |
    TOKEN=$(python3 /opt/gh-app-token.py 2>/dev/null || echo "")
    if [ -n "$TOKEN" ]; then
      git clone "https://x-access-token:${TOKEN}@github.com/fostfox/agent-rig-data.git" \
        /home/{{ dev_user }}/dev/agent-rig-data
      chown -R {{ dev_user }}:{{ dev_user }} /home/{{ dev_user }}/dev/agent-rig-data
    fi
  args:
    creates: "/home/{{ dev_user }}/dev/agent-rig-data/.git"
  when: priv_repo_url.stdout == ""

# ── Apply config ──
- name: Copy Hermes config
  copy:
    src: "{{ playbook_dir }}/../hermes.yaml"
    dest: "/home/{{ dev_user }}/.hermes/config.yaml"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0644"

- name: Copy SOUL.md
  copy:
    src: "{{ playbook_dir }}/../SOUL.md"
    dest: "/home/{{ dev_user }}/.hermes/SOUL.md"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0644"

- name: Copy memories from private data repo
  shell: |
    if [ -d /home/{{ dev_user }}/dev/agent-rig-data/memories ]; then
      cp -r /home/{{ dev_user }}/dev/agent-rig-data/memories /home/{{ dev_user }}/.hermes/memories
      chown -R {{ dev_user }}:{{ dev_user }} /home/{{ dev_user }}/.hermes/memories
    fi

# ── Secrets ──
- name: Write Hermes .env
  copy:
    content: |
      OPENROUTER_API_KEY={{ lookup('env', 'OPENROUTER_API_KEY') }}
    dest: "/home/{{ dev_user }}/.hermes/.env"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0600"

# ── Platform config from 1Password ──
- name: Set Telegram platform
  become_user: "{{ dev_user }}"
  command: "hermes config set platforms.telegram.enabled true"
  when: lookup('env', 'TELEGRAM_CHAT_ID') | default('', true) != ''

- name: Set Telegram chat_id
  become_user: "{{ dev_user }}"
  command: "hermes config set platforms.telegram.home_channel.chat_id {{ lookup('env', 'TELEGRAM_CHAT_ID') }}"
  when: lookup('env', 'TELEGRAM_CHAT_ID') | default('', true) != ''

- name: Set Telegram user_id
  become_user: "{{ dev_user }}"
  command: "hermes config set platforms.telegram.home_channel.user_id {{ lookup('env', 'TELEGRAM_USER_ID') }}"
  when: lookup('env', 'TELEGRAM_USER_ID') | default('', true) != ''

- name: Set Telegram name
  become_user: "{{ dev_user }}"
  command: "hermes config set platforms.telegram.home_channel.name {{ lookup('env', 'TELEGRAM_NAME') }}"
  when: lookup('env', 'TELEGRAM_NAME') | default('', true) != ''

# ── Skills ──
- name: Install skills from repo
  become_user: "{{ dev_user }}"
  shell: |
    for skill_dir in /home/{{ dev_user }}/dev/agent-rig/skills/*/; do
      if [ -f "$skill_dir/SKILL.md" ]; then
        hermes skills install "$skill_dir" 2>/dev/null || true
      fi
    done
  ignore_errors: true

- name: Install hub skills
  become_user: "{{ dev_user }}"
  shell: |
    hermes skills install hermes-agent 2>/dev/null || true
    hermes skills install github-pr-workflow 2>/dev/null || true
  ignore_errors: true

# ── Write S3 creds from Object Storage ──
- name: Write S3 credentials file
  copy:
    dest: /etc/hermes-s3-creds
    owner: root
    group: root
    mode: "0600"
    content: |
      S3_ACCESS_KEY={{ s3_access_key }}
      S3_SECRET_KEY={{ s3_secret_key }}
      S3_HOSTNAME={{ s3_hostname }}
      S3_BUCKET={{ s3_bucket }}

# ── Sync script ──
- name: Install sync script
  copy:
    dest: "/opt/hermes-sync.sh"
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/bash
      # agent-rig sync daemon
      #   PUSH: memories → private repo (agent-rig-data)
      #   PULL: config   → from public repo (agent-rig)
      set -e

      PUBLIC="/home/{{ dev_user }}/dev/agent-rig"
      PRIVATE="/home/{{ dev_user }}/dev/agent-rig-data"
      HERMES="/home/{{ dev_user }}/.hermes"
      TOKEN_SCRIPT="/opt/gh-app-token.py"
      LOG="/tmp/hermes-sync.log"

      echo "=== Sync $(date -Iseconds) ===" >> "$LOG"

      # ── PUSH memories to private repo ──
      cd "$PRIVATE"
      for f in MEMORY.md USER.md; do
        if [ -f "$HERMES/memories/$f" ]; then
          if ! diff -q "$HERMES/memories/$f" "memories/$f" 2>/dev/null; then
            cp "$HERMES/memories/$f" "memories/$f"
            echo "memory $f changed" >> "$LOG"
          fi
        fi
      done
      if ! git diff --quiet -- memories/; then
        git add memories/
        git commit -m "sync: memory $(date -I)" --no-gpg-sign
        # Push via GitHub App token
        TOKEN=$(python3 "$TOKEN_SCRIPT" 2>/dev/null || echo "")
        if [ -n "$TOKEN" ]; then
          git push "https://x-access-token:${TOKEN}@github.com/fostfox/agent-rig-data.git" main 2>> "$LOG"
          echo "pushed memories" >> "$LOG"
        fi
      fi

      # ── PULL config from public repo ──
      cd "$PUBLIC"
      OLD=$(git rev-parse HEAD)
      git pull origin main 2>> "$LOG" || true
      NEW=$(git rev-parse HEAD)
      if [ "$OLD" != "$NEW" ]; then
        echo "config update: $OLD → $NEW" >> "$LOG"
        git diff --quiet "$OLD..$NEW" -- hermes.yaml || { cp hermes.yaml "$HERMES/config.yaml"; echo "config applied" >> "$LOG"; }
        git diff --quiet "$OLD..$NEW" -- SOUL.md || { cp SOUL.md "$HERMES/SOUL.md"; echo "SOUL applied" >> "$LOG"; }
        for d in skills/*/; do
          [ -f "$d/SKILL.md" ] || continue
          git diff --quiet "$OLD..$NEW" -- "$d" || { hermes skills install "$PWD/$d" 2>/dev/null; echo "skill $d updated" >> "$LOG"; }
        done
      fi
      echo "=== Done $(date -Iseconds) ===" >> "$LOG"

# ── Backup script ──
- name: Install backup script
  copy:
    dest: "/opt/hermes-backup.sh"
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/bash
      # Daily: state.db + profile export → Vultr Object Storage
      set -e

      source /etc/hermes-s3-creds
      HERMES="/home/{{ dev_user }}/.hermes"
      DATE=$(date -I)
      LOG="/tmp/hermes-backup.log"

      echo "=== Backup $DATE ===" >> "$LOG"

      apt-get install -y s3cmd 2>/dev/null || true

      cat > /tmp/.s3cfg << CFG
      [default]
      access_key = $S3_ACCESS_KEY
      secret_key = $S3_SECRET_KEY
      host_base = $S3_HOSTNAME
      host_bucket = %(bucket)s.$S3_HOSTNAME
      use_https = True
      CFG

      # Profile export
      hermes profile export default --output /tmp/hermes-export.tar.gz 2>/dev/null || true
      if [ -f /tmp/hermes-export.tar.gz ]; then
        s3cmd -c /tmp/.s3cfg put /tmp/hermes-export.tar.gz s3://$S3_BUCKET/export-$DATE.tar.gz >> "$LOG" 2>&1
      fi

      # state.db
      if [ -f "$HERMES/state.db" ]; then
        s3cmd -c /tmp/.s3cfg put "$HERMES/state.db" s3://$S3_BUCKET/state-$DATE.db >> "$LOG" 2>&1
      fi

      # Clean >30 days
      s3cmd -c /tmp/.s3cfg ls s3://$S3_BUCKET/ | while read -r line; do
        ts=$(echo "$line" | awk '{print $1" "$2}')
        age=$(( ($(date +%s) - $(date -d "$ts" +%s)) / 86400 ))
        if [ "$age" -gt 30 ]; then
          name=$(echo "$line" | awk '{print $4}')
          s3cmd -c /tmp/.s3cfg del "$name" >> "$LOG" 2>&1
        fi
      done

      echo "=== Backup done ===" >> "$LOG"

# ── Cron ──
- name: Install sync cron (every 10 min)
  cron:
    name: hermes-sync
    job: "/opt/hermes-sync.sh"
    minute: "*/10"
    user: "{{ dev_user }}"

- name: Install backup cron (daily 3AM)
  cron:
    name: hermes-backup
    job: "/opt/hermes-backup.sh"
    hour: "3"
    minute: "0"
    user: "{{ dev_user }}"

# ── Verify ──
- name: Run hermes doctor
  become_user: "{{ dev_user }}"
  shell: "hermes doctor 2>&1 | head -20"
  register: doctor
  ignore_errors: true
  changed_when: false

- name: Show doctor results
  debug:
    msg: "{{ doctor.stdout_lines | default(['hermes doctor skipped']) }}"