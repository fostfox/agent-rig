---
- name: Install Hermes CLI
  shell: |
    curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
  args:
    creates: /home/{{ dev_user }}/.hermes/bin/hermes
  register: hermes_install

- name: Fix Hermes ownership
  file:
    path: "/root/.hermes"
    state: directory
    recurse: yes
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
  when: hermes_install.changed

- name: Move Hermes to dev user
  shell: |
    if [ -d /root/.hermes ] && [ ! -d /home/{{ dev_user }}/.hermes ]; then
      mv /root/.hermes /home/{{ dev_user }}/.hermes
      chown -R {{ dev_user }}:{{ dev_user }} /home/{{ dev_user }}/.hermes
    fi
  when: hermes_install.changed

- name: Copy Hermes config from repo
  copy:
    src: ../config/hermes.yaml
    dest: "/home/{{ dev_user }}/.hermes/config.yaml"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0644"

- name: Copy SOUL.md from repo
  copy:
    src: ../config/SOUL.md
    dest: "/home/{{ dev_user }}/.hermes/SOUL.md"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0644"

- name: Write Hermes secrets (.env)
  copy:
    content: |
      OPENROUTER_API_KEY={{ lookup('env', 'OPENROUTER_API_KEY') }}
    dest: "/home/{{ dev_user }}/.hermes/.env"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0600"

- name: Verify Hermes config
  become_user: "{{ dev_user }}"
  command: "hermes config list 2>&1 | head -15"
  register: config_check
  changed_when: false

- name: Show applied config
  debug:
    msg: "{{ config_check.stdout_lines }}"

- name: Install key Hermes skills
  become_user: "{{ dev_user }}"
  shell: |
    hermes skills install hermes-agent 2>/dev/null || true
    hermes skills install github-pr-workflow 2>/dev/null || true
    hermes skills install claude-code 2>/dev/null || true
    hermes skills install codex 2>/dev/null || true

- name: Install custom skills from repo
  become_user: "{{ dev_user }}"
  shell: |
    hermes skills install /home/{{ dev_user }}/dev/agent-rig/skills/dev-workflow 2>/dev/null || true
  ignore_errors: true

- name: Run hermes doctor
  become_user: "{{ dev_user }}"
  shell: "hermes doctor 2>&1 | head -20"
  register: doctor
  ignore_errors: true
  changed_when: false

- name: Show doctor results
  debug:
    msg: "{{ doctor.stdout_lines | default(['hermes doctor skipped']) }}"
