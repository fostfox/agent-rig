---
- name: Provision Vultr VM
  hosts: localhost
  gather_facts: false
  vars:
    vm_label: "{{ lookup('env', 'VM_LABEL') | default('agent-rig', true) }}"
    vm_plan: "{{ lookup('env', 'VULTR_PLAN') | default('vc2-2c-4gb', true) }}"
    vm_region: "{{ lookup('env', 'VULTR_REGION') | default('fra', true) }}"
    vm_os: "Ubuntu 24.04 LTS x64"
    s3_label: agent-rig-backups
    s3_cluster: "ams2.vultrobjects.com"

  tasks:
    - name: Upload SSH key to Vultr
      vultr.cloud.ssh_key:
        name: "{{ vm_label }}"
        ssh_key: "{{ lookup('env', 'SSH_PUBLIC_KEY') }}"
      register: vultr_ssh_key

    - name: Create VM
      vultr.cloud.instance:
        label: "{{ vm_label }}"
        plan: "{{ vm_plan }}"
        region: "{{ vm_region }}"
        os: "{{ vm_os }}"
        ssh_keys: ["{{ vultr_ssh_key.vultr_ssh_key.name }}"]
        hostname: "{{ vm_label }}"
        tags:
          - "{{ vm_label }}"
        backups: false
      register: vm
      until: vm is success
      retries: 3
      delay: 10

    - name: Create Object Storage for backups
      vultr.cloud.object_storage:
        label: "{{ s3_label }}"
        cluster: "{{ s3_cluster }}"
        state: present
      register: os
      when: lookup('env', 'VULTR_API_KEY') | default('', true) != ''

    - name: Wait for SSH
      wait_for:
        host: "{{ vm.vultr_instance.main_ip }}"
        port: 22
        timeout: 300
        delay: 10

    - name: Add host to inventory with S3 creds
      add_host:
        name: "{{ vm.vultr_instance.main_ip }}"
        groups: agent_rig
        ansible_user: root
        ansible_ssh_private_key_file: "{{ lookup('env', 'SSH_KEY_FILE') }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        s3_access_key: "{{ os.vultr_object_storage.s3_access_key | default('') }}"
        s3_secret_key: "{{ os.vultr_object_storage.s3_secret_key | default('') }}"
        s3_hostname: "{{ os.vultr_object_storage.s3_hostname | default('') }}"
        s3_bucket: "{{ s3_label }}"

- name: Configure VM
  hosts: agent_rig
  gather_facts: true
  vars:
    dev_user: dev
    dev_home: /home/dev
    workspace: /home/dev/dev
    s3_access_key: "{{ hostvars[inventory_hostname].s3_access_key | default('') }}"
    s3_secret_key: "{{ hostvars[inventory_hostname].s3_secret_key | default('') }}"
    s3_hostname: "{{ hostvars[inventory_hostname].s3_hostname | default('') }}"
    s3_bucket: "{{ hostvars[inventory_hostname].s3_bucket | default('agent-rig-backups') }}"

  pre_tasks:
    - name: Wait for system to be ready
      wait_for_connection:
        timeout: 60

  roles:
    - base
    - gh-cli
    - yc-cli
    - docker
    - hermes-cli

  post_tasks:
    - name: Print VM info
      debug:
        msg:
          - ""
          - "✅ {{ vm_label }} provisioned!"
          - "IP: {{ ansible_host }}"
          - "SSH: ssh -i <your-key> dev@{{ ansible_host }}"
          - "S3 backup: {{ s3_hostname }}/{{ s3_bucket }}"
          - ""
