# Hermes Agent configuration — version-controlled template
# Secrets (API keys) go in ~/.hermes/.env, NOT in this file.
# Copy to ~/.hermes/config.yaml on the target machine.

model:
  default: deepseek/deepseek-v4-flash
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  api_mode: chat_completions

database:
  journal_mode: wal

agent:
  max_turns: 150
  verbose: false
  reasoning_effort: medium

terminal:
  backend: local
  cwd: /home/dev/dev
  timeout: 180
  home_mode: auto

web:
  backend: ddgs
  use_gateway: false

browser:
  inactivity_timeout: 120
  cloud_provider: local

tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false

compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  protect_first_n: 3

prompt_caching:
  cache_ttl: 5m

display:
  compact: false
  streaming: true
  show_reasoning: false

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375

delegation:
  max_iterations: 50

skills:
  creation_nudge_interval: 15

code_execution:
  timeout: 300
  max_tool_calls: 50
